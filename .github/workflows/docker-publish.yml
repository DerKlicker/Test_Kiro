name: Docker-Image bauen und veröffentlichen

# Baut das Container-Image und veröffentlicht es in der GitHub Container
# Registry (ghcr.io). Von dort kann TrueNAS SCALE es direkt ziehen.
#
# Ausgelöst bei:
#   - Push auf main                -> Tag "latest"
#   - Versions-Tags (v1.0.0 etc.)  -> entsprechende Versions-Tags
#   - manuell über die Actions-UI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Image-Namen in Kleinbuchstaben umwandeln
        id: image
        # ghcr.io verlangt komplett kleingeschriebene Image-Pfade. github.repository
        # kann Großbuchstaben enthalten (hier: DerKlicker/Test_Kiro) -> explizit
        # in Kleinbuchstaben wandeln, damit Push- und Pull-Pfad identisch sind.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten / Tags ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
